name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Sürüm .nvmrc'den okunuyor: CI ile geliştiricilerin makineleri tek
          # yerden aynı Node'a bağlansın. Next.js 16, 22.22.2'den eski 22.x
          # sürümlerini desteklemiyor.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # `next typegen` önce çalışıyor: PageProps ve RouteContext gibi yol
      # tiplerini Next üretiyor ve build almamış bir kopyada var olmuyorlar.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend foundation (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # setup-uv v9.0.0 — immutable commit pin.
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      # Python sürümü apps/backend/.python-version'dan okunuyor; .nvmrc ile
      # aynı mantık. uv.lock güncel değilse --locked burada düşer (npm ci'nin
      # Python karşılığı).
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Typecheck
        run: uv run --locked mypy

      - name: Test
        run: uv run --locked pytest

  contract:
    name: Contract drift (openapi + fixtures + cross-validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `needs:` yok: en çok düşmesi beklenen job bu, sinyalini erken istiyoruz.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # setup-uv v9.0.0 — immutable commit pin.
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install Python dependencies
        working-directory: apps/backend
        run: uv sync --locked --dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Bayatlama guard'ı: biri Pydantic modelini değiştirip artefaktları
      # yeniden üretmezse iki test suite de bayat dosyalara karşı yeşil
      # kalırdı. Fixture tabanlı drift kontrollerini dekoratif yapan şey tam
      # olarak bu adımın eksikliği.
      - name: Fail if generated artifacts are stale
        working-directory: apps/backend
        run: |
          uv run --locked python scripts/export_openapi.py --check
          uv run --locked python scripts/export_fixtures.py --check

      - name: Second guard — no uncommitted regeneration
        run: git diff --exit-code -- docs/api/openapi.json tests/fixtures/contract

      # Python'un ürettiği gövdeleri frontend'in Zod şemalarıyla doğrular:
      # sözleşmenin iki dilde aynı okunduğunun kanıtı.
      - name: Cross-validate fixtures against Zod
        run: npm run test:contract
