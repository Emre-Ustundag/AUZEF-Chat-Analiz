name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Sürüm .nvmrc'den okunuyor: CI ile geliştiricilerin makineleri tek
          # yerden aynı Node'a bağlansın. Next.js 16, 22.22.2'den eski 22.x
          # sürümlerini desteklemiyor.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # `next typegen` önce çalışıyor: PageProps ve RouteContext gibi yol
      # tiplerini Next üretiyor ve build almamış bir kopyada var olmuyorlar.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/backend

    services:
      # Entegrasyon testleri Postgres, Redis ve MinIO ister; yoksa
      # tests/conftest.py onları açık bir mesajla atlar. Servisleri burada
      # ayağa kaldırmak, uçtan uca upload akışının da CI'da koşması demek.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auzef
          POSTGRES_PASSWORD: auzef
          POSTGRES_DB: auzef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auzef -d auzef"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start MinIO
        # Servis container'ı olarak çalıştırılamıyor: bitnami/minio kaldırıldı
        # (Docker Hub'da tek etiket kalmamış) ve minio/minio "server /data"
        # komutunu gerektiriyor — GitHub Actions servis tanımı image'dan sonra
        # argüman geçirmeye izin vermiyor. Bu yüzden docker run ile başlatılıyor.
        # Etiket compose'daki ile aynı ve sabit; "latest" bir daha bu şekilde
        # sessizce kaybolmasın.
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO hazır"; exit 0
            fi
            sleep 2
          done
          echo "MinIO 60 saniyede hazır olmadı"; docker logs minio; exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # --frozen: uv.lock'a birebir uyulur; CI'ın sürüm sürüklemesiyle
        # yeşil/kırmızı olması engellenir.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy app tests

      - name: Migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://auzef:auzef@127.0.0.1:5432/auzef

      - name: Test
        run: uv run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://auzef:auzef@127.0.0.1:5432/auzef
          REDIS_URL: redis://127.0.0.1:6379/0
          S3_ENDPOINT_URL: http://127.0.0.1:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: auzef-test
