name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Sürüm .nvmrc'den okunuyor: CI ile geliştiricilerin makineleri tek
          # yerden aynı Node'a bağlansın. Next.js 16, 22.22.2'den eski 22.x
          # sürümlerini desteklemiyor.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # `next typegen` önce çalışıyor: PageProps ve RouteContext gibi yol
      # tiplerini Next üretiyor ve build almamış bir kopyada var olmuyorlar.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/backend

    services:
      # Entegrasyon testleri Postgres, Redis ve MinIO ister; yoksa
      # tests/conftest.py onları açık bir mesajla atlar. Servisleri burada
      # ayağa kaldırmak, uçtan uca upload akışının da CI'da koşması demek.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: auzef
          POSTGRES_PASSWORD: auzef
          POSTGRES_DB: auzef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auzef -d auzef"
          --health-interval 5s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO hazır"; exit 0
            fi
            sleep 2
          done
          echo "MinIO 60 saniyede hazır olmadı"; docker logs minio; exit 1

      # setup-uv v9.0.0 — immutable commit pin.
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      # Python sürümü apps/backend/.python-version'dan okunuyor; .nvmrc ile
      # aynı mantık. uv.lock güncel değilse --locked burada düşer (npm ci'nin
      # Python karşılığı).
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Typecheck
        run: uv run --locked mypy

      - name: Migrations
        run: uv run --locked alembic upgrade head
        env:
          AUZEF_DATABASE_URL: postgresql+asyncpg://auzef:auzef@127.0.0.1:5432/auzef

      - name: Test
        run: uv run --locked pytest
        env:
          AUZEF_DATABASE_URL: postgresql+asyncpg://auzef:auzef@127.0.0.1:5432/auzef
          AUZEF_REDIS_URL: redis://127.0.0.1:6379/0
          AUZEF_S3_ENDPOINT_URL: http://127.0.0.1:9000
          AUZEF_S3_ACCESS_KEY: minioadmin
          AUZEF_S3_SECRET_KEY: minioadmin
          AUZEF_S3_BUCKET: auzef-test

  e2e:
    name: End-to-end (browser, mock backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `needs:` yok — `web` job'ıyla paralel koşuyor. E2E en yavaş sinyal;
    # lint'i beklemesi toplam süreyi uzatır, bir şey kazandırmaz.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Yalnızca chromium: üç tarayıcıyı da kurmak indirme süresini üçe
      # katlar ve buradaki testler tarayıcıya özgü davranış ölçmüyor.
      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # Yalnızca `mock` projesi. `stack` projesi çalışan bir docker compose
      # yığını ister; CI'da o yolu koşturmak imaj derlemesi + sekiz servis
      # demek ve `backend` job'ı zaten aynı entegrasyonu servislere karşı
      # ölçüyor. `stack` yerelde `npm run e2e:stack` ile koşulur.
      - name: Run end-to-end tests
        run: npm run e2e:mock

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  contract:
    name: Contract drift (openapi + fixtures + cross-validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # `needs:` yok: en çok düşmesi beklenen job bu, sinyalini erken istiyoruz.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # setup-uv v9.0.0 — immutable commit pin.
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install Python dependencies
        working-directory: apps/backend
        run: uv sync --locked --dev

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # Bayatlama guard'ı: biri Pydantic modelini değiştirip artefaktları
      # yeniden üretmezse iki test suite de bayat dosyalara karşı yeşil
      # kalırdı. Fixture tabanlı drift kontrollerini dekoratif yapan şey tam
      # olarak bu adımın eksikliği.
      - name: Fail if generated artifacts are stale
        working-directory: apps/backend
        run: |
          uv run --locked python scripts/export_openapi.py --check
          uv run --locked python scripts/export_fixtures.py --check

      - name: Second guard — no uncommitted regeneration
        run: git diff --exit-code -- docs/api/openapi.json tests/fixtures/contract

      # Python'un ürettiği gövdeleri frontend'in Zod şemalarıyla doğrular:
      # sözleşmenin iki dilde aynı okunduğunun kanıtı.
      - name: Cross-validate fixtures against Zod
        run: npm run test:contract
