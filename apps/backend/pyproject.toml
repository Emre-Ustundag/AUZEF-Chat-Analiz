[project]
name = "auzef-backend"
version = "0.1.0"
description = "AUZEF Chat Analiz FastAPI backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.121",
  "pydantic>=2.12",
  "pydantic-settings>=2.8",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "boto3>=1.35",
  "openpyxl>=3.1",
  "polars>=1.17",
  "pyarrow>=18.1",
  "python-multipart>=0.0.20",
  "cryptography>=50.0.0",
  "httpx>=0.28",
  "structlog>=25.5",
  "uvicorn[standard]>=0.38",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.0",
  "httpx2>=2.10",
  "ruff>=0.14",
  "mypy>=1.18",
  "boto3-stubs[s3]>=1.35",
  "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "TID"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]
"app/services/xlsx.py" = ["ANN401"]
"alembic/*" = ["F401"]
"tests/**" = ["ANN401"]
"tests/factories.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts", "tests"]
warn_unused_ignores = true
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "polars.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: Postgres/Redis/MinIO gerektiren uçtan uca testler",
]
